name: Build and publish juridisch register

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Generate register from archived official sources
        run: python pipeline/build.py
      - name: Check legal data and source integrity
        run: python -m unittest discover -s pipeline/tests -v
      - name: Install application dependencies
        run: npm ci --prefix app
      - name: Build application for the repository path
        run: npm run build --prefix app
        env:
          REGISTER_BASE_PATH: /juridisch-register/
      - name: Include original sources in the static site
        run: python pipeline/prepare_site.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: app/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
